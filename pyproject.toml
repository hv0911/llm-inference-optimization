[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "production-llm-optimization"
version = "1.0.0"
description = "Production-grade LLM quantization (AWQ/GPTQ) and vLLM inference optimization"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
authors = [
    {name = "YOUR_HF_USERNAME"},
]
keywords = [
    "llm", "quantization", "awq", "gptq", "vllm",
    "inference", "optimization", "transformers",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.1.0",
    "transformers>=4.45.0",
    "accelerate>=0.34.0",
    "safetensors>=0.4.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "psutil>=5.9.0",
    "pynvml>=11.5.0",
    "pandas>=2.1.0",
    "numpy>=1.26.0",
]

[project.optional-dependencies]
quantize = [
    "llmcompressor>=0.5.0",
]
eval = [
    "lm-eval>=0.4.0",
]
serve = [
    "vllm>=0.6.0",
    "openai>=1.0.0",
]
benchmark = [
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "mypy>=1.7.0",
    "ruff>=0.1.0",
]
all = [
    "production-llm-optimization[quantize,eval,serve,benchmark,dev]",
]

[project.urls]
Homepage = "https://github.com/YOUR_HF_USERNAME/production-llm-optimization"
Repository = "https://github.com/YOUR_HF_USERNAME/production-llm-optimization"
Issues = "https://github.com/YOUR_HF_USERNAME/production-llm-optimization/issues"

[tool.setuptools.packages.find]
include = ["src*", "benchmark*", "evaluation*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --tb=short --strict-markers"
markers = [
    "slow: marks tests that require GPU or large models",
    "gpu: marks tests that require CUDA GPU",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
