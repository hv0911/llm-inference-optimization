# =============================================================================
# Docker Compose — vLLM Model Serving
# =============================================================================
# Usage:
#   docker compose up vllm-base       # Serve FP16 baseline
#   docker compose up vllm-awq        # Serve AWQ quantized
#   docker compose up vllm-gptq       # Serve GPTQ quantized
# =============================================================================

services:
  # --- FP16 Baseline ---
  vllm-base:
    image: vllm/vllm-openai:latest
    ports:
      - "8000:8000"
    volumes:
      - ../models:/models
    environment:
      - HUGGING_FACE_HUB_TOKEN=${HF_TOKEN:-}
    command: >
      --model /models/base
      --host 0.0.0.0
      --port 8000
      --gpu-memory-utilization 0.85
      --max-model-len 2048
      --dtype auto
      --trust-remote-code
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  # --- AWQ Quantized ---
  vllm-awq:
    image: vllm/vllm-openai:latest
    ports:
      - "8001:8000"
    volumes:
      - ../models:/models
    environment:
      - HUGGING_FACE_HUB_TOKEN=${HF_TOKEN:-}
    command: >
      --model /models/awq
      --host 0.0.0.0
      --port 8000
      --gpu-memory-utilization 0.85
      --max-model-len 2048
      --dtype auto
      --trust-remote-code
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  # --- GPTQ Quantized ---
  vllm-gptq:
    image: vllm/vllm-openai:latest
    ports:
      - "8002:8000"
    volumes:
      - ../models:/models
    environment:
      - HUGGING_FACE_HUB_TOKEN=${HF_TOKEN:-}
    command: >
      --model /models/gptq
      --host 0.0.0.0
      --port 8000
      --gpu-memory-utilization 0.85
      --max-model-len 2048
      --dtype auto
      --trust-remote-code
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped
